  .nav-tab { flex-shrink: 0; padding: 9px 14px; font-size: 10px; font-weight: 700; border: none; background: transparent; cursor: pointer; letter-spacing: 0.5px; text-transform: uppercase; border-bottom: 2px solid transparent; margin-bottom: -1px; transition: all 0.2s; color: #3a3f5c; }

  /* BOTTOM NAV */
  .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: #0d1022; border-top: 1px solid #151929; display: flex; padding: 8px 0 max(4px, env(safe-area-inset-bottom)); z-index: 30; }
  .bottom-btn { flex: 1; background: none; border: none; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 4px 2px; }
  .bottom-icon { font-size: 20px; }
  .bottom-label { font-size: 9px; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; color: #3a3f5c; }
  .bottom-btn.active .bottom-label { color: #818cf8; }

  /* CARDS */
  .card { background: #0d1022; border-radius: 16px; padding: 16px; margin-bottom: 12px; border: 1px solid #151929; }
  .card-hero { background: linear-gradient(135deg, #131728, #0d1022); border: 1px solid #1e2445; box-shadow: 0 4px 40px #6366f110; }
  .section-label { font-size: 10px; color: #3a3f5c; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 10px; margin-top: 4px; }
  .page { padding: 16px 16px 0; display: none; }
  .page.active { display: block; }

  /* DONUT */
  .donut-wrap { position: relative; width: 110px; height: 110px; flex-shrink: 0; }
  .donut-wrap svg { transform: rotate(-90deg); }
  .donut-text { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; }
  .donut-pct { font-size: 18px; font-weight: 800; color: #f0f0f8; display: block; }
  .donut-sub { font-size: 9px; color: #555; display: block; }

  /* CATEGORY GRID */
  .cat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
  .cat-card { background: #0d1022; border-radius: 12px; padding: 12px; border: 1px solid #151929; }
  .cat-card.over { border-color: rgba(248,113,113,0.3); }
  .cat-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .cat-icon-label { display: flex; gap: 6px; align-items: center; font-size: 11px; color: #aaa; }
  .cat-icon { font-size: 16px; }
  .cat-amount { font-weight: 800; font-size: 16px; margin-bottom: 5px; }
  .cat-bar-bg { height: 4px; background: #1e2235; border-radius: 2px; overflow: hidden; }
  .cat-bar { height: 100%; border-radius: 2px; transition: width 0.5s; }
  .cat-limit { font-size: 10px; color: #3a3f5c; margin-top: 4px; }
  .badge-max { font-size: 9px; color: #f87171; background: #f8717115; padding: 1px 5px; border-radius: 6px; }

  .exp-amount { font-weight: 800; margin-right: 8px; white-space: nowrap; }
  .del-btn { background: #f8717115; border: 1px solid #f8717130; color: #f87171; cursor: pointer; font-size: 12px; padding: 4px 8px; border-radius: 7px; font-weight: 700; flex-shrink: 0; }

  .chart-wrap { background: #0d1022; border-radius: 14px; padding: 16px; margin-bottom: 14px; border: 1px solid #151929; }

  .chart-lbl { font-size: 9px; color: #3a3f5c; font-weight: 700; }
  .table-wrap { background: #0d1022; border-radius: 14px; overflow: hidden; border: 1px solid #151929; }
  .table-head { padding: 10px 14px; border-bottom: 1px solid #151929; display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; }

  .table-row { padding: 10px 14px; border-bottom: 1px solid #151929; display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; cursor: pointer; }

  .alert-red { background: #200e0e; border: 1px solid #f87171; }
  .alert-green { background: #0e1e12; border: 1px solid #4ade80; }
  .alert-yellow { background: #1e1b0e; border: 1px solid #fbbf24; }

// STORAGE

function saveData() {
  try {
    localStorage.setItem("budget-alex-html-v1", JSON.stringify({
      expenses: state.expenses,
      fixedAmounts: state.fixedAmounts,
      income: state.income,
    }));
    const badge = document.getElementById("saved-badge");
    if (badge) { badge.style.opacity = "1"; setTimeout(()=>badge.style.opacity="0", 1200); }
  } catch(e) {}
}

function loadData() {
  try {
    const d = localStorage.getItem("budget-alex-html-v1");
    if (d) {
      const p = JSON.parse(d);
      if (p.expenses) state.expenses = p.expenses;
      if (p.fixedAmounts) state.fixedAmounts = p.fixedAmounts;
      if (p.income) state.income = p.income;
    }
  } catch(e) {}
}

function monthFixed() { return Object.values(state.fixedAmounts).reduce((s,v)=>s+v,0); }
function monthIncome() { return Object.values(state.income).reduce((s,v)=>s+v,0); }
function catTotal(cat, m) { return monthExps(m||state.month).filter(e=>e.cat===cat).reduce((s,e)=>s+e.amount,0); }
function tlColor(actual, target) {
  if (!target) return "#666";
  const r = actual/target;
  if (r<=0.85) return "#4ade80";
  if (r<=1.0) return "#fbbf24";
  return "#f87171";
}
function getCat(id) { return EXPENSE_CATS.find(c=>c.id===id)||{icon:"📦",color:"#94a3b8",label:"Divers"}; }

// ═══════════════════════════════════════════════════════════
// DONUT SVG
// ═══════════════════════════════════════════════════════════
function donutSVG(pct, color, size=110, sw=11) {
  const r = (size-sw*2)/2, c=size/2;
  const circ = 2*Math.PI*r;
  const dash = Math.min(pct/100,1)*circ;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="#1e2235" stroke-width="${sw}"/>
    <circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="${color}" stroke-width="${sw}"
      stroke-dasharray="${dash} ${circ}" stroke-linecap="round"
      transform="rotate(-90 ${c} ${c})"/>
  </svg>`;
}

function miniBar(val, max, color) {
  const pct = max>0 ? Math.min((val/max)*100,100) : 0;
  return `<div class="cat-bar-bg"><div class="cat-bar" style="width:${pct}%;background:${color}"></div></div>`;
}

// ═══════════════════════════════════════════════════════════
// RENDER FUNCTIONS
// ═══════════════════════════════════════════════════════════
function renderDash() {
  const m = state.month;
  const varTotal = monthVarTotal(m);
  const fixed = monthFixed();
  const inc = monthIncome();
  const total = varTotal + fixed;
  const solde = inc - total;
  const pct = inc>0 ? (total/inc)*100 : 0;
  const gc = solde<0?"#f87171":pct>85?"#fbbf24":"#6366f1";
  const exps = [...monthExps(m)].sort((a,b)=>b.date.localeCompare(a.date));

  let alerts = "";
  if (solde<0) alerts+=`<div class="alert alert-red">⚠️ <strong style="color:#f87171">Découvert de ${fmt(Math.abs(solde))}</strong> ce mois.</div>`;

  let catCards = EXPENSE_CATS.map(cat=>{
    const tot = catTotal(cat.id, m);
    const over = tot > cat.target;
    return `<div class="cat-card${over?" over":""}">
      <div class="cat-header">
        <div class="cat-icon-label"><span class="cat-icon">${cat.icon}</span>${cat.label}</div>
        ${over?'<span class="badge-max">MAX</span>':""}
      </div>
      <div class="cat-amount" style="color:${over?"#f87171":cat.color}">${fmt(tot)}</div>
      ${miniBar(tot, cat.target, over?"#f87171":cat.color)}
      <div class="cat-limit">/ ${fmt(cat.target)}</div>
    </div>`;
  }).join("");

  let expRows = "";
  if (exps.length===0) {
    expRows = `<div class="empty-msg">Aucune dépense ce mois — appuie sur <strong>＋ Saisie</strong></div>`;
  } else {
    expRows = exps.slice(0,10).map(e=>{
      const cat = getCat(e.cat);
      const d = new Date(e.date+"T12:00:00").toLocaleDateString("fr-FR",{day:"numeric",month:"short"});
      return `<div class="exp-row">
        <div class="exp-icon-wrap" style="background:${cat.color}20">${cat.icon}</div>
        <div class="exp-info">
          <div class="exp-label">${e.label}</div>
          <div class="exp-meta">${d} · ${cat.label}</div>
        </div>
        <span class="exp-amount" style="color:${cat.color}">${fmt(e.amount,2)}</span>
        <button class="del-btn" onclick="delExp('${e.id}','${m}')">✕</button>
      </div>`;
    }).join("");
  }

  document.getElementById("page-dash").innerHTML = `
    <div class="card card-hero" style="margin-top:16px">
      <div style="display:flex;align-items:center;gap:16px">
        <div style="position:relative;width:110px;height:110px;flex-shrink:0">
          ${donutSVG(pct, gc)}
          <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center">
            <span style="font-size:17px;font-weight:800;color:#f0f0f8;display:block">${Math.round(pct)}%</span>
            <span style="font-size:9px;color:#555;display:block">dépensé</span>
          </div>
        </div>
        <div style="flex:1">
          <div style="display:flex;justify-content:space-between;margin-bottom:10px">
            <div>
              <div style="font-size:10px;color:#3a3f5c;text-transform:uppercase;letter-spacing:1px">Revenus</div>
              <div style="font-size:20px;font-weight:800;color:#4ade80">${fmt(inc)}</div>
            </div>
            <div style="text-align:right">
              <div style="font-size:10px;color:#3a3f5c;text-transform:uppercase;letter-spacing:1px">Solde</div>
              <div style="font-size:20px;font-weight:800;color:${solde>=0?"#4ade80":"#f87171"}">${solde>=0?"+":""}${fmt(solde)}</div>
            </div>
          </div>
          <div style="display:flex;gap:10px">
            <div style="flex:1;background:#080b14;border-radius:10px;padding:8px 10px">
              <div style="font-size:10px;color:#f97316;margin-bottom:2px">Fixes</div>
              <div style="font-weight:800;color:#f97316">${fmt(fixed)}</div>
            </div>
            <div style="flex:1;background:#080b14;border-radius:10px;padding:8px 10px">
              <div style="font-size:10px;color:#a78bfa;margin-bottom:2px">Variable</div>
              <div style="font-weight:800;color:#a78bfa">${fmt(varTotal)}</div>
            </div>
          </div>
        </div>
      </div>
    </div>
    ${alerts}
    <div class="section-label">Dépenses par catégorie</div>
    <div class="cat-grid">${catCards}</div>
    <div class="section-label">Dernières dépenses</div>
    <div class="exp-list">${expRows}</div>
    <div style="height:8px"></div>
  `;
}

function renderSemaine() {
  const m = state.month;
  const inc = monthIncome();
  const fixed = monthFixed();
  const budget = inc - fixed;
  const [y, mo] = m.split("-").map(Number);
  const daysInMonth = new Date(y, mo, 0).getDate();
  const weeksCount = Math.ceil(daysInMonth / 7);
  const weekBudget = budget / weeksCount;

  let weeksHTML = "";
  for (let w=0; w<weeksCount; w++) {
    const startDay = w*7+1;
    const endDay = Math.min((w+1)*7, daysInMonth);
    const startDate = `${m}-${String(startDay).padStart(2,"0")}`;
    const endDate = `${m}-${String(endDay).padStart(2,"0")}`;
    const wExps = monthExps(m).filter(e=>e.date>=startDate && e.date<=endDate);
    const wTotal = wExps.reduce((s,e)=>s+e.amount,0);
    const over = wTotal > weekBudget;
    const color = over?"#f87171":wTotal/weekBudget>0.8?"#fbbf24":"#4ade80";

    const expRows = wExps.length===0
      ? `<div style="font-size:12px;color:#3a3f5c;margin-top:8px">Aucune dépense saisie</div>`
      : `<div style="margin-top:10px">${wExps.map(e=>{
          const cat=getCat(e.cat);
          return `<div class="week-exp"><span style="color:#aaa">${cat.icon} ${e.label}</span><span style="color:${cat.color};font-weight:700">${fmt(e.amount,2)}</span></div>`;
        }).join("")}</div>`;

    weeksHTML += `
      <div class="week-card${over?" over":""}">
        <div class="week-header">
          <span class="week-title">Semaine ${w+1} <span style="font-size:11px;color:#3a3f5c">(${startDay}–${endDay})</span></span>
          <div class="week-amounts">
            ${over?`<span style="font-size:10px;color:#f87171;background:#f8717115;padding:2px 7px;border-radius:8px">+${fmt(wTotal-weekBudget)}</span>`:""}
            <span class="week-total" style="color:${color}">${fmt(wTotal)}</span>
            <span class="week-limit">/ ${fmt(weekBudget)}</span>
          </div>
        </div>
        ${miniBar(wTotal, weekBudget, color)}
        ${expRows}
      </div>`;
  }

  document.getElementById("page-semaine").innerHTML = `
    <div style="margin-top:16px"></div>
    <div class="section-label">Suivi hebdomadaire — ${ALL_MONTHS.find(m2=>m2.value===m)?.label||m}</div>
    <div class="card" style="border-color:#1e2445">
      <div style="font-size:12px;color:#3a3f5c;margin-bottom:4px">Budget variable mensuel</div>
      <div style="font-weight:800;font-size:22px;color:#818cf8">${fmt(budget)}</div>
      <div style="font-size:12px;color:#3a3f5c;margin-top:4px">≈ ${fmt(weekBudget)} / semaine</div>
    </div>
    ${weeksHTML}
    <div style="height:8px"></div>
  `;
}

function renderAnnuel() {
  const fixed = monthFixed();
  const inc = monthIncome();
  const activeMonths = ALL_MONTHS.filter(m=>m.value<="2026-05");
  const totals = activeMonths.map(m=>monthVarTotal(m.value)+fixed);
  const soldes = activeMonths.map(m=>inc-monthVarTotal(m.value)-fixed);
  const totalSaved = soldes.filter(s=>s>0).reduce((a,b)=>a+b,0);
  const totalOver = Math.abs(soldes.filter(s=>s<0).reduce((a,b)=>a+b,0));
  const maxBar = Math.max(...totals, inc);

  const kpis = [
    {label:"Revenus annuels (proj.)", val:inc*12, color:"#4ade80"},
    {label:"Charges fixes annuelles", val:fixed*12, color:"#f97316"},
    {label:"Total économisé", val:totalSaved, color:"#818cf8"},
    {label:"Total dépassements", val:totalOver, color:"#f87171"},
  ];

  const bars = activeMonths.map((m,i)=>{
    const h = maxBar>0 ? Math.max((totals[i]/maxBar)*90,4) : 4;
    const s = soldes[i];
    const color = s<0?"#f87171":s<200?"#fbbf24":"#818cf8";
    const isCur = m.value===state.month;
    return `<div class="chart-col" style="cursor:pointer" onclick="setMonth('${m.value}','dash')">
      <div class="chart-bar" style="height:${h}px;background:${color}40;border:1px solid ${color}60"></div>
      <div class="chart-lbl" style="color:${isCur?"#818cf8":"#3a3f5c"};font-weight:${isCur?800:400}">${m.short}</div>
    </div>`;
  }).join("");

  const rows = activeMonths.map((m,i)=>{
    const s = soldes[i];
    const isCur = m.value===state.month;
    return `<div class="table-row${isCur?" active":""}" onclick="setMonth('${m.value}','dash')">
      <span style="color:${isCur?"#818cf8":"#e8eaf6"};font-weight:${isCur?800:400}">${m.short}</span>
      <span style="color:#a78bfa">${fmt(monthVarTotal(m.value))}</span>
      <span>${fmt(totals[i])}</span>
      <span style="color:${s>=0?"#4ade80":"#f87171"};font-weight:700">${s>=0?"+":""}${fmt(s)}</span>
    </div>`;
  }).join("");

  document.getElementById("page-annuel").innerHTML = `
    <div style="margin-top:16px"></div>
    <div class="section-label">Résumé annuel 2026</div>
    <div class="kpi-grid">${kpis.map(k=>`
      <div class="kpi-card">
        <div class="kpi-label">${k.label}</div>
        <div class="kpi-val" style="color:${k.color}">${fmt(k.val)}</div>
      </div>`).join("")}
    </div>
    <div class="chart-wrap">
      <div style="font-size:11px;color:#3a3f5c;margin-bottom:14px;text-transform:uppercase;letter-spacing:1px">Dépenses totales / mois</div>
      <div class="chart-bars">${bars}</div>
    </div>
    <div class="table-wrap">
      <div class="table-head">
        <span>Mois</span><span>Variable</span><span>Total</span><span>Solde</span>
      </div>
      ${rows}
    </div>
    <div style="height:8px"></div>
  `;
}

  document.getElementById("page-budget").innerHTML = `

    </div>
    <div class="card" style="background:linear-gradient(135deg,#131728,#0d1022);border-color:#1e2445">

// ═══════════════════════════════════════════════════════════
// ACTIONS
// ═══════════════════════════════════════════════════════════
function setCat(id) {
  state.newCat = id;
  renderSaisie();
}

function addExpense() {
  const amount = parseFloat(state.newAmount);
  if (!amount || amount<=0) { alert("Saisis un montant !"); return; }
  const cat = getCat(state.newCat);
  const exp = {
    id: uid(),
    date: state.newDate,
    cat: state.newCat,
    label: state.newLabel || cat.label,
    amount,
  };
  const key = state.newDate.slice(0,7);
  if (!state.expenses[key]) state.expenses[key] = [];
  state.expenses[key].push(exp);
  state.newAmount = "";
  state.newLabel = "";
  saveData();
  const btn = document.getElementById("add-btn");
  if (btn) { btn.textContent="✓ Ajoutée !"; btn.classList.add("success"); setTimeout(()=>{ btn.textContent="Ajouter la dépense"; btn.classList.remove("success"); },1500); }
  renderSaisie();
}

function delExp(id, m) {
  if (!confirm("Supprimer cette dépense ?")) return;
  state.expenses[m] = (state.expenses[m]||[]).filter(e=>e.id!==id);
  saveData();
  render();
}

function updateIncome(id, val) {
  state.income[id] = parseFloat(val)||0;
  saveData();
}

function updateFixed(id, val) {
  state.fixedAmounts[id] = parseFloat(val)||0;
  saveData();
}

function setMonth(val, v) {
  state.month = val;
  document.getElementById("month-select").value = val;
  if (v) state.view = v;
  render();
}

function setView(v) {
  state.view = v;
  document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
  document.getElementById("page-"+v).classList.add("active");
  document.querySelectorAll(".bottom-btn").forEach(b=>{
    b.classList.toggle("active", b.dataset.view===v);
  });
  document.querySelectorAll(".nav-tab").forEach(b=>{
    b.classList.toggle("active", b.dataset.view===v);
  });
  renderView(v);
}

function renderView(v) {
  if (v==="dash") renderDash();
  else if (v==="saisie") renderSaisie();
  else if (v==="semaine") renderSemaine();
  else if (v==="annuel") renderAnnuel();
  else if (v==="budget") renderBudget();
}

function render() {
  renderView(state.view);
}

// ═══════════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════════
function init() {
  loadData();

  // Month select
  const sel = document.getElementById("month-select");
  ALL_MONTHS.forEach(m=>{
    const opt = document.createElement("option");
    opt.value = m.value; opt.textContent = m.label;
    sel.appendChild(opt);
  });
  sel.value = state.month;
  sel.addEventListener("change", e=>setMonth(e.target.value));

  // Nav tabs
  const navTabs = document.getElementById("nav-tabs");
  VIEWS.forEach(v=>{
    const btn = document.createElement("button");
    btn.className = "nav-tab" + (v.id===state.view?" active":"");
    btn.dataset.view = v.id;
    btn.textContent = v.icon+" "+v.label;
    btn.addEventListener("click", ()=>setView(v.id));
    navTabs.appendChild(btn);
  });

  // Bottom nav
  const bottomNav = document.getElementById("bottom-nav");
  VIEWS.forEach(v=>{
    const btn = document.createElement("button");
    btn.className = "bottom-btn" + (v.id===state.view?" active":"");
    btn.dataset.view = v.id;
    btn.innerHTML = `<span class="bottom-icon">${v.icon}</span><span class="bottom-label">${v.label}</span>`;
    btn.addEventListener("click", ()=>setView(v.id));
    bottomNav.appendChild(btn);
  });

  render();
}

window.addEventListener("DOMContentLoaded", init);
